
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Header</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        .header {
            width: 100%;
            background: #ffffff;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            padding: 18px 7%;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 25px;
        }

        .logo {
            font-size: 27px;
            font-weight: bold;
            color: #1746a2;
            text-decoration: none;
            white-space: nowrap;
        }

        .logo span {
            color: #f59e0b;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: #333333;
            font-size: 15px;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #1746a2;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .search-btn {
            border: none;
            background: transparent;
            font-size: 22px;
            cursor: pointer;
        }

        .contact-btn {
            text-decoration: none;
            background: #1746a2;
            color: #ffffff;
            padding: 12px 22px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.3s;
            white-space: nowrap;
        }

        .contact-btn:hover {
            background: #103477;
        }

        .menu-toggle {
            display: none;
            font-size: 28px;
            border: none;
            background: transparent;
            cursor: pointer;
        }

        @media (max-width: 900px) {
            .header {
                padding: 16px 5%;
            }

            .menu-toggle {
                display: block;
            }

            .navbar {
                flex-wrap: wrap;
            }

            .nav-links {
                display: none;
                flex-direction: column;
                align-items: flex-start;
                width: 100%;
                gap: 20px;
                padding: 15px 0;
            }

            .nav-links.show {
                display: flex;
            }

            .header-actions {
                margin-left: auto;
            }

            .contact-btn {
                padding: 10px 14px;
            }
        }

        @media (max-width: 480px) {
            .logo {
                font-size: 22px;
            }

            .search-btn {
                display: none;
            }

            .contact-btn {
                font-size: 12px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>

<header class="header">
    <nav class="navbar">

        <a href="#" class="logo">Your<span>Brand</span></a>

        <button class="menu-toggle"
                id="menuToggle"
                aria-label="Toggle navigation"
                aria-expanded="false"
                aria-controls="navLinks">
            ☰
        </button>

        <ul class="nav-links" id="navLinks">
            <li><a href="#" class="active">Welcome</a></li>
            <li><a href="#about">About Us</a></li>
            <li><a href="#services">Services</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#blog">Blog</a></li>
            <li><a href="{% url 'login' %}">Login</a></li>
        </ul>

        <div class="header-actions">
            <button class="search-btn"
                    aria-label="Search"
                    onclick="alert('Connect your search feature here')">
                &#8981;
            </button>

            <a href="#contact" class="contact-btn">Contact Us →</a>
        </div>

    </nav>
</header>

<script>
    const menuToggle = document.getElementById("menuToggle");
    const navLinks = document.getElementById("navLinks");

    menuToggle.addEventListener("click", function () {
        const isOpen = navLinks.classList.toggle("show");
        menuToggle.setAttribute("aria-expanded", isOpen);
        menuToggle.textContent = isOpen ? "✕" : "☰";
    });
</script>

</body>
</html>
